<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Keshav Knitwears | Wholesale Sweaters & Woolen Caps</title>

  <meta name="description"
        content="Keshav Knitwears - Wholesale and customizable sweaters and woolen caps from Dholewal, Ludhiana, Punjab.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #faf9f6;
      color: #222;
      line-height: 1.6;
    }

    /* NAVBAR */
    header {
      background: #171717;
      color: white;
      padding: 15px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .brand {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    /* HERO */
    .hero {
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 50px 20px;
      background:
        linear-gradient(rgba(0,0,0,.52), rgba(0,0,0,.52)),
        url("images/thumbnail.jpg") center/cover no-repeat;
      color: white;
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .button {
      display: inline-block;
      padding: 13px 25px;
      background: white;
      color: #171717;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      margin: 5px;
    }

    .button:hover {
      transform: scale(1.03);
    }

    /* SECTIONS */
    section {
      padding: 70px 7%;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    .section-subtitle {
      text-align: center;
      color: #666;
      max-width: 700px;
      margin: 0 auto 40px;
    }

    /* ABOUT */
    .about {
      max-width: 900px;
      margin: auto;
      text-align: center;
      font-size: 18px;
    }

    /* PRODUCTS */
    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      transition: .3s;
    }

    .product:hover {
      transform: translateY(-5px);
    }

    .product img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 20px;
      text-align: center;
    }

    .product-info h3 {
      margin-bottom: 8px;
      font-size: 22px;
    }

    /* WHY US */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .feature {
      background: white;
      padding: 30px 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .feature span {
      font-size: 35px;
      display: block;
      margin-bottom: 10px;
    }

    .feature h3 {
      margin-bottom: 8px;
    }

    /* CONTACT */
    .contact {
      text-align: center;
      background: #eeeae3;
    }

    .contact-box {
      max-width: 700px;
      margin: auto;
    }

    .contact-box p {
      margin: 10px 0;
      font-size: 18px;
    }

    .instagram {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 25px;
      background: #171717;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* FOOTER */
    footer {
      background: #171717;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    footer p {
      margin: 5px;
    }

    /* MOBILE */
    @media (max-width: 800px) {

      header {
        flex-direction: column;
        gap: 10px;
      }

      nav a {
        margin: 0 6px;
        font-size: 13px;
      }

      .hero {
        min-height: 70vh;
      }

      .hero h1 {
        font-size: 36px;
      }

      .hero p {
        font-size: 17px;
      }

      .products,
      .features {
        grid-template-columns: 1fr;
      }

      section {
        padding: 55px 5%;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header>
    <div class="brand">KESHAV KNITWEARS</div>

    <nav>
      <a href="#home">Home</a>
      <a href="#sweaters">Sweaters</a>
      <a href="#caps">Caps</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>


  <!-- HERO -->
  <section class="hero" id="home">

    <div class="hero-content">

      <h1>Keshav Knitwears</h1>

      <p>
        Cozy Warm Sweaters & Woolen Caps
      </p>

      <p>
        Wholesale • Customizable • Quality Knitwear
      </p>
